name: Build Standalone Pouch Ritual Labels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build and test Forge mod
        run: gradle build --no-daemon
      - name: Verify packaged JAR
        run: python3 scripts/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: pouch-ritual-labels-0.1.0-alpha
          path: build/libs/pouch-ritual-labels-0.1.0-alpha.jar
          if-no-files-found: error
